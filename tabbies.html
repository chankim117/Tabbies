<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabbies</title>
    <!-- Runs first so a fixed Light/Dark theme from Settings shows without a flash. -->
    <script src="shared/theme-boot.js"></script>
    <!-- The icon on this page's tab in Chrome's tab strip: the same 16 and 32px
         files as the toolbar icon in manifest.json. Chrome caches tab icons by
         their address, so bump ?v= whenever the icon art changes. -->
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png?v=2" />
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="shared/explorer.css" />
    <link rel="stylesheet" href="shared/settings.css" />
    <link rel="stylesheet" href="shared/view.css" />
    <!-- type="module" lets tabbies.js `import` the shared explorer files. -->
    <script type="module" src="tabbies.js"></script>
  </head>
  <body class="full-tab">
    <div class="page">
      <header class="view-header">
        <img src="icons/icon48.png" width="28" height="28" alt="" />
        <h1>Tabbies</h1>
        <div class="view-actions">
          <p class="shortcut" id="shortcut" hidden>Open or close Tabbies: <kbd></kbd></p>
          <button type="button" data-open="side-panel" data-icon="sidePanel"
            title="Open in the side panel" aria-label="Open in the side panel"></button>
          <button type="button" data-open="settings" data-icon="settings"
            title="Settings" aria-label="Settings"></button>
        </div>
      </header>
      <!-- The explorer (search + tree) is built in here by shared/explorer.js.
           Settings (shared/settings.js) are shown in its place when asked. -->
      <main id="explorer"></main>
    </div>
  </body>
</html>
